# Previews par PR — nginx sur DEBFCOETAPFRT01 (déployé par infra/ansible/front.yml)
#
# Le point d'entrée Cegedim (BigIP) porte le certificat wildcard et transmet le
# trafic déchiffré : la VM écoute en HTTP (80), sans certificat local.
# Une preview = un dossier /srv/previews/pr-<n>/ ; le vhost résout le numéro de
# PR par regex sur le hostname, aucune conf ni reload par PR.
# Installation manuelle : docs/infra/installation-previews.md.
# Le smoke test de preview.yml vise http://localhost/ avec le Host forcé.

# Redirection vers HTTPS pilotée par l'en-tête X-Forwarded-Proto posé par le
# proxy : on ne redirige que si le proxy dit explicitement « http ». Sans
# en-tête (accès direct au port 80 de la VM, ou proxy qui ne le pose pas), on
# sert tel quel : une redirection inconditionnelle bouclerait derrière le BigIP.
# Dès que Cegedim confirme que le BigIP pose X-Forwarded-Proto, décommenter la
# ligne `"" 1;` : tout accès en clair qui ne vient pas du proxy sera alors
# renvoyé vers HTTPS.
map $http_x_forwarded_proto $vers_https {
  default 0;
  "http" 1;
  # "" 1;
}

server {
  listen 80;
  server_name ~^pr-(?<pr>\d+)\.dev\.certifpro\.cegedim\.cloud$;

  if ($vers_https) {
    return 301 https://$host$request_uri;
  }

  root /srv/previews/pr-$pr;
  index index.html;

  # Redirections relatives : derrière le proxy TLS, une Location absolue en
  # http:// ferait quitter le HTTPS.
  absolute_redirect off;

  # IP réelle du visiteur dans les logs — renseigner l'IP du BigIP :
  # set_real_ip_from <IP_DU_POINT_DENTREE>;
  # real_ip_header X-Forwarded-For;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # Basic auth (le 443 public est ouvert : jamais de preview sans mot de passe).
  # Le fichier htpasswd est écrit par front.yml depuis le secret
  # PREVIEW_BASIC_AUTH_PASSWORD (utilisateur « etape »).
  # `satisfy any` + allow localhost : le smoke test du workflow passe sans
  # identifiants, tout accès distant les exige. Jamais allow/deny sans
  # auth_basic : cela fermerait tout accès distant.
  satisfy any;
  allow 127.0.0.1;
  allow ::1;
  deny all;
  auth_basic "Preview ETAPE";
  auth_basic_user_file /etc/nginx/previews.htpasswd;

  error_page 404 /404.html;

  # trailingSlash Next : un export statique ne redirige pas de lui-même.
  location = /simulateur {
    return 308 /simulateur/;
  }

  # 404 servie par la bonne app sous le préfixe.
  location /simulateur/ {
    error_page 404 /simulateur/404.html;
  }

  # Assets fingerprintés : cache long (add_header redéfini ne s'hérite pas,
  # d'où le rappel du noindex).
  location ~ ^(/simulateur)?/_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}

# Tout autre hostname : rien à servir, sauf la sonde de santé.
server {
  listen 80 default_server;
  server_name _;

  # Sonde pour le moniteur du pool BigIP (qui interroge la VM par IP, donc sans
  # Host pr-<n>) : à communiquer à Cegedim comme cible du health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
