# Site de Recette — nginx sur REBFCOETAPFRT01 (déployé par infra/ansible/front-recette.yml)
#
# Le point d'entrée Cegedim porte le certificat et transmet le trafic
# déchiffré : la VM écoute en HTTP (80), sans certificat local.
# Une seule version servie, celle validée par la PO, déployée par la CI dans
# /srv/etape-recette : pas de previews par PR, donc un server_name fixe.
# Pas de basic auth, contrairement aux previews du dev : l'URL n'est joignable
# qu'en interne (bastion ou réseau FCO).

# Redirection vers HTTPS pilotée par l'en-tête X-Forwarded-Proto posé par le
# proxy : on ne redirige que si le proxy dit explicitement « http ». Sans
# en-tête (accès direct au port 80 de la VM, ou proxy qui ne le pose pas), on
# sert tel quel : une redirection inconditionnelle bouclerait derrière le
# point d'entrée. Dès que Cegedim confirme qu'il pose X-Forwarded-Proto,
# décommenter la ligne `"" 1;`.
# Variable distincte de `$vers_https` (previews.conf) : un `map` est global au
# contexte http, deux confs qui cohabiteraient ne doivent pas se la disputer.
map $http_x_forwarded_proto $vers_https_recette {
  default 0;
  "http" 1;
  # "" 1;
}

server {
  listen 80;
  server_name etape-recette.france-competences.cegedim.cloud;

  if ($vers_https_recette) {
    return 301 https://$host$request_uri;
  }

  root /srv/etape-recette;
  index index.html;

  # Redirections relatives : derrière le proxy TLS, une Location absolue en
  # http:// ferait quitter le HTTPS.
  absolute_redirect off;

  # IP réelle du visiteur dans les logs — renseigner l'IP du point d'entrée :
  # set_real_ip_from <IP_DU_POINT_DENTREE>;
  # real_ip_header X-Forwarded-For;

  # Environnement de validation : jamais indexé, même si l'URL fuitait.
  add_header X-Robots-Tag "noindex, nofollow" always;

  error_page 404 /404.html;

  # trailingSlash Next : un export statique ne redirige pas de lui-même.
  location = /simulateur {
    return 308 /simulateur/;
  }

  # 404 servie par la bonne app sous le préfixe.
  location /simulateur/ {
    error_page 404 /simulateur/404.html;
  }

  # Assets fingerprintés : cache long (add_header redéfini ne s'hérite pas,
  # d'où le rappel du noindex).
  location ~ ^(/simulateur)?/_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}

# Tout autre hostname : rien à servir, sauf la sonde de santé.
server {
  listen 80 default_server;
  server_name _;

  # Sonde pour le health check du point d'entrée (qui interroge la VM par IP,
  # donc sans Host connu) : à communiquer à Cegedim comme cible du moniteur.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 404;
  }
}
