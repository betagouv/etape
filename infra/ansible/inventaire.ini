# Machines Cegedim, deux environnements :
#   - dev (QA) : DEBFCO* (cf. DAT et mails Cegedim de juillet) ;
#   - Recette : REBFCO*, livrée par Cegedim le 16/10.
# Connexion via le compte de service `deploy`, créé par Cegedim avec sudo et la
# clé du runner (point du 2/09, vérifié sur la Recette depuis OPS01).
# Prérequis détaillés dans README.md.
#
# REBFCOETAPKC01 (Keycloak de Recette) n'est volontairement pas inventoriée :
# son socle (installation, mises à jour) est exploité par Cegedim. Notre
# périmètre se limite aux realms, via la console d'administration (plus tard,
# un export de realm versionné). L'inventorier inviterait à y jouer un playbook
# qui marcherait sur leur exploitation.

[front]
debfcoetapfrt01.fco.cegedim.cloud

[back]
debfcoetapapp01.fco.cegedim.cloud

[front_recette]
rebfcoetapfrt01.fco.cegedim.cloud

[back_recette]
rebfcoetapapp01.fco.cegedim.cloud

[all:vars]
ansible_user=deploy
