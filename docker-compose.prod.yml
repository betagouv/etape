# Pile de déploiement.
#
# Quatre services et une base : le front statique et l'API derrière un même
# nginx, et Keycloak sur son propre sous-domaine, derrière un proxy qui n'y
# laisse passer que le realm applicatif. Keycloak configure son realm lui-même
# au démarrage — plus de conteneur d'initialisation, dont l'arrêt était compté
# comme un échec par les hébergeurs qui attendent `docker compose up --wait`.
#
# Rien à préparer sur la machine : l'hébergeur clone, construit, démarre. Deux
# domaines lui restent à déclarer, sur les deux seuls services exposés :
#
#   web   https://etape.example.org        (port 80)
#   auth  https://auth.etape.example.org   (port 80)
#
# `auth`, et non `keycloak` : c'est le proxy qui porte le sous-domaine, et lui
# qui refuse l'administration. Keycloak n'expose plus de port, précisément pour
# qu'on ne puisse pas lui repointer un domaine dessus par inadvertance.
#
# Les variables attendues sont listées dans `deploy/.env.example`. Marche à
# suivre complète : `docs/deploiement.md`.

services:
  # ---------------------------------------------------------------------
  # Front statique, et point d'entrée unique du domaine principal.
  #
  # nginx transmet `/api/` à l'API : front et API partagent donc l'origine,
  # ce qui évite CORS et permet au cookie de session de rester `SameSite=Lax`.
  # ---------------------------------------------------------------------
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------
  # API d'authentification. Jamais exposée directement : elle n'est jointe
  # que par nginx, sur le réseau interne.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      API_PORT: 3002

      # Le préfixe `/api` est porté par l'application elle-même et n'est pas
      # retiré par nginx : les chemins vus par Nest sont ceux vus par le
      # navigateur, et la `redirect_uri` reste valable des deux côtés du proxy.
      API_BASE_URL: ${PUBLIC_URL}/api
      FRONT_BASE_URL: ${PUBLIC_URL}

      # URL **publique** de Keycloak, et non son nom de service interne :
      # `openid-client` compare l'`issuer` annoncé par le document de découverte
      # à celui qu'on lui donne, et les deux doivent coïncider. L'appel sort donc
      # du réseau Docker pour revenir par le proxy — voir `extra_hosts` plus bas
      # si l'hôte ne sait pas router ce demi-tour.
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_PUBLIC_URL}/realms/etape
      KEYCLOAK_CLIENT_ID: etape-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_FRANCECONNECT_ALIAS: franceconnect
    # L'hôte ne renvoie pas vers lui-même une requête adressée à sa propre adresse
    # publique : la découverte OIDC échouait, avec « Le fournisseur d'identité est
    # injoignable » à l'arrivée sur `/api/auth/login`. Le nom pointe donc vers la
    # passerelle de l'hôte, où écoute le proxy : la requête ne sort plus de la
    # machine. Le certificat reste valable — le nom demandé, lui, ne change pas.
    extra_hosts:
      - "${KEYCLOAK_HOSTNAME:?nom d'hôte de KEYCLOAK_PUBLIC_URL, sans le schéma}:host-gateway"
    healthcheck:
      # `/auth/session` répond 401 sans cookie : c'est une réponse, donc un
      # service vivant. Toute autre issue — connexion refusée, 5xx — signale un
      # démarrage manqué.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/auth/session').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------
  # Proxy du sous-domaine de Keycloak.
  #
  # Porte le domaine `auth.…` à la place de Keycloak, et **refuse tout par
  # défaut** : seuls passent le realm `etape` — écrans de connexion, points
  # OIDC, endpoint du broker que FranceConnect appelle au retour — et les
  # ressources du thème. Rien d'autre n'est joignable depuis Internet, ni la
  # console d'administration, ni l'API qui partage son préfixe, ni le realm
  # `master` qui délivre les jetons.
  #
  # Administration : `docker exec <conteneur> /opt/keycloak/bin/kcadm.sh …`.
  # Voir `docs/deploiement.md`.
  # ---------------------------------------------------------------------
  auth:
    build:
      context: .
      target: auth
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - keycloak
    healthcheck:
      # Deux réponses valent bonne santé : le realm répond, et la racine est
      # refusée. La seconde est la sonde du refus par défaut — une sonde qui ne
      # vérifierait que la première laisserait passer un proxy transformé en
      # simple relais, administration comprise.
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/realms/etape/.well-known/openid-configuration && ! wget -q -O /dev/null http://127.0.0.1/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------
  # Keycloak.
  #
  # Sur son propre sous-domaine, derrière `auth` : ni le même domaine que le
  # front ni un préfixe de chemin. Les écrans de connexion et le broker
  # FranceConnect gardent ainsi une adresse stable, indépendante de
  # l'hébergement du front. Le jour où Keycloak déménage, seul un enregistrement
  # DNS bouge — et la `redirect_uri` déclarée chez FranceConnect, pénible à
  # faire changer, reste valable.
  #
  # Aucun `expose` : Keycloak n'est joint que par `auth`, sur le réseau interne.
  # Le port absent est ce qui empêche de lui rattacher un domaine sans y penser,
  # et de court-circuiter ainsi le filtrage de l'administration.
  # ---------------------------------------------------------------------
  keycloak:
    build:
      context: .
      target: keycloak
    restart: unless-stopped
    # Configure le realm en tâche de fond, puis démarre Keycloak au premier plan
    # — `start` et non `start-dev`, avec `--import-realm` qui crée le realm au
    # premier démarrage et l'ignore ensuite (stratégie IGNORE_EXISTING).
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/etape-demarrer.sh"]
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Hostname figé, explicitement : c'est ce qui empêche un en-tête `Host`
      # forgé de faire émettre des jetons au nom d'un émetteur frauduleux.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      # TLS est terminé par le proxy ; Keycloak écoute en clair derrière lui et
      # ne se fie aux `X-Forwarded-*` que si on le lui demande.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Lues par `etape-init.sh`, qui applique au realm ce que le fichier
      # d'import ne peut pas porter.
      KEYCLOAK_INTERNAL_URL: http://127.0.0.1:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_TEST_USER_PASSWORD: ${KEYCLOAK_TEST_USER_PASSWORD:-}
      FRANCECONNECT_CLIENT_ID: ${FRANCECONNECT_CLIENT_ID:-}
      FRANCECONNECT_CLIENT_SECRET: ${FRANCECONNECT_CLIENT_SECRET:-}
      # `INTEGRATION_STANDARD_V2` vise le bac à sable `fcp-low.sbx`,
      # `INTEGRATION_STANDARD_LEGACY_V2` l'ancien `fcp-low.integ01`, et
      # `PRODUCTION_STANDARD_V2` la production. Les identifiants ne valent que
      # pour l'environnement où ils ont été délivrés : ailleurs, FranceConnect
      # répond « client_id inconnu ».
      FRANCECONNECT_ENVIRONNEMENT: ${FRANCECONNECT_ENVIRONNEMENT:-INTEGRATION_STANDARD_V2}
      FRANCECONNECT_EIDAS: ${FRANCECONNECT_EIDAS:-EIDAS1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    healthcheck:
      # Les sondes de santé vivent sur le port de gestion (9000), séparé du
      # trafic applicatif. L'image ne contient ni curl ni wget, d'où ce dialogue
      # HTTP écrit à la main sur un descripteur.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  keycloak-db-data:
