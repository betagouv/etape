# Serveur du sous-domaine de Keycloak.
#
# Keycloak n'a pas d'option pour servir sa console d'administration ailleurs que
# sur le port applicatif — `--hostname-admin` ne fait qu'en fixer l'URL. Le
# filtrage est donc à notre charge, et c'est la marche à suivre que Keycloak
# recommande lui-même.
#
# Ce qui doit rester public, c'est le realm `etape` : les écrans de connexion,
# les points OIDC, et surtout l'endpoint du broker que FranceConnect appelle au
# retour. Tout le reste — administration, realm `master` — n'a aucune raison
# d'être joignable depuis Internet.
#
# L'administration passe désormais par la machine : `docker exec` pour `kcadm`,
# ou un tunnel `ssh -L` vers le conteneur. Voir `docs/deploiement.md`.

map $http_x_forwarded_proto $etape_schema_auth {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Rien de tout cela n'a vocation à être indexé, écrans de connexion compris.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résolveur DNS de Docker, comme pour l'API : associé à une variable dans
    # `proxy_pass`, il diffère la résolution du nom `keycloak` au moment de la
    # requête. nginx démarre alors même si Keycloak n'est pas encore levé, là où
    # un nom écrit en dur ferait échouer le chargement de la configuration.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # Ce qui est refusé.
    #
    # `404` et non `403` : un refus explicite confirmerait qu'il y a quelque
    # chose à cette adresse, et la console de Keycloak est une cible connue.
    #
    # `/admin` couvre la console **et** l'API REST d'administration, qui
    # partagent ce préfixe. L'image ne contient déjà plus la console
    # (`--features-disabled=admin`), mais l'API, elle, y est toujours : c'est
    # ici qu'elle est mise hors de portée.
    #
    # `/realms/master` est le realm des administrateurs : c'est son point
    # `/token` qui délivre le jeton d'administration. Le bloquer aussi évite de
    # laisser en ligne un formulaire d'authentification qui n'a aucun usage
    # public.
    # ---------------------------------------------------------------------
    location ^~ /admin { return 404; }
    location ^~ /realms/master { return 404; }
    location ^~ /metrics { return 404; }

    location / {
        set $etape_keycloak http://keycloak:8080;
        proxy_pass $etape_keycloak$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $etape_schema_auth;
        proxy_set_header X-Forwarded-Host  $host;

        # Keycloak émet des cookies de session volumineux, et l'en-tête d'une
        # réponse de fin de parcours en porte plusieurs. Aux tailles par défaut,
        # nginx répond 502 avec « upstream sent too big header » — une panne qui
        # n'apparaît qu'une fois le parcours réellement joué.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
