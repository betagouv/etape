# Serveur du sous-domaine de Keycloak.
#
# Keycloak n'a pas d'option pour servir sa console d'administration ailleurs que
# sur le port applicatif — `--hostname-admin` ne fait qu'en fixer l'URL. Le
# filtrage est donc à notre charge, et c'est la marche à suivre que Keycloak
# recommande lui-même.
#
# **Tout est refusé par défaut.** Seuls passent les chemins dont le parcours de
# connexion a besoin. C'est l'inverse d'une liste de chemins interdits, et c'est
# volontaire : une liste d'interdits laisse passer ce qu'on a oublié d'y mettre,
# et ce qu'on oublie ici, c'est une surface d'administration. Un point d'entrée
# ajouté par une version ultérieure de Keycloak arriverait fermé plutôt
# qu'ouvert.
#
# Rien de ce qui touche à l'administration n'est donc joignable depuis
# Internet : ni la console — absente de l'image, `--features-disabled=admin` —
# ni l'API REST qui partage son préfixe, ni le realm `master` qui délivre les
# jetons. La configuration du realm passe par `deploy/keycloak-init.sh`, à
# l'intérieur du conteneur, sur `127.0.0.1`.

map $http_x_forwarded_proto $etape_schema_auth {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Rien de tout cela n'a vocation à être indexé, écrans de connexion compris.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résolveur DNS de Docker, comme pour l'API : associé à une variable dans
    # `proxy_pass`, il diffère la résolution du nom `keycloak` au moment de la
    # requête. nginx démarre alors même si Keycloak n'est pas encore levé, là où
    # un nom écrit en dur ferait échouer le chargement de la configuration.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # Refus par défaut.
    #
    # `404` et non `403` : un refus explicite confirmerait qu'il y a quelque
    # chose à cette adresse, et la console de Keycloak est une cible connue.
    # ---------------------------------------------------------------------
    location / {
        return 404;
    }

    # ---------------------------------------------------------------------
    # Le realm applicatif, et lui seul.
    #
    # Couvre tout le parcours : `/protocol/openid-connect/*` pour
    # l'autorisation, les jetons et la déconnexion, `/login-actions/*` pour la
    # soumission des formulaires, et `/broker/franceconnect/endpoint` que
    # FranceConnect appelle au retour.
    #
    # Le nom du realm est écrit ici, comme il l'est déjà dans
    # `KEYCLOAK_ISSUER_URL` : le changer demande de repasser par les deux.
    # ---------------------------------------------------------------------
    location ^~ /realms/etape/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    # ---------------------------------------------------------------------
    # Ressources statiques du thème : la CSS et le JS que les écrans chargent.
    # Servies sous une empreinte de version, sans rien de dynamique.
    # ---------------------------------------------------------------------
    location ^~ /resources/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }
}
