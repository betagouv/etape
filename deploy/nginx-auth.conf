# Serveur du sous-domaine de Keycloak.
#
# **Tout est refusé par défaut** ; seuls passent les chemins dont le parcours de
# connexion a besoin. Une liste d'interdits laisserait passer ce qu'on a oublié
# d'y mettre, et ce qu'on oublie ici, c'est une surface d'administration : ni la
# console — absente de l'image, `--features-disabled=admin` — ni l'API REST qui
# partage son préfixe, ni le realm `master` qui délivre les jetons, n'ont de
# raison d'être joignables. Un point d'entrée ajouté par une version ultérieure
# de Keycloak arrive fermé plutôt qu'ouvert.
#
# Keycloak n'offre aucune option pour servir sa console ailleurs et recommande
# ce filtrage. La configuration du realm passe par `deploy/keycloak-init.sh`, à
# l'intérieur du conteneur, sur `127.0.0.1`.

map $http_x_forwarded_proto $etape_schema_auth {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résolveur DNS de Docker : associé à une variable dans `proxy_pass`, il
    # diffère la résolution du nom `keycloak` au moment de la requête. nginx
    # démarre alors même si Keycloak n'est pas encore levé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `404` et non `403` : un refus explicite confirmerait qu'il y a quelque
    # chose là, et la console de Keycloak est une cible connue.
    location / {
        return 404;
    }

    # Le realm applicatif : autorisation, jetons, déconnexion, soumission des
    # formulaires, et `/broker/franceconnect/endpoint` que FranceConnect appelle
    # au retour. Le nom du realm est écrit ici comme dans `KEYCLOAK_ISSUER_URL`.
    location ^~ /realms/etape/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    # CSS et JS du thème, servis sous une empreinte de version.
    location ^~ /resources/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }
}
