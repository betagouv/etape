# Serveur du sous-domaine de Keycloak.
#
# **Tout est refusé par défaut** ; seuls passent les chemins du parcours de
# connexion. Une liste d'interdits laisserait passer ce qu'on a oublié d'y
# mettre, et ce qu'on oublie ici, c'est une surface d'administration — console,
# API REST qui partage son préfixe, realm `master` qui délivre les jetons. Un
# point d'entrée ajouté par une version ultérieure arrive fermé.
#
# La configuration du realm passe par `deploy/keycloak-init.sh`, à l'intérieur
# du conteneur, sur `127.0.0.1`.

map $http_x_forwarded_proto $etape_scheme_auth {
    default $http_x_forwarded_proto;
    ""      https;
}

# L'IP de l'usager, et non celle du proxy de l'hébergeur : sans elle, chaque
# limite ci-dessous compterait tout le monde comme une seule adresse. Seul un
# saut privé est cru, l'adresse publique la plus à droite fait foi.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Formulaires anonymes qui envoient un email (« mot de passe oublié »,
# inscription, renvoi du lien de vérification) et tentatives de mot de passe.
limit_req_zone $binary_remote_addr zone=keycloak_login_actions:10m rate=10r/m;
# Chaque départ de connexion ouvre une session d'authentification en mémoire.
limit_req_zone $binary_remote_addr zone=keycloak_authorization:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Diffère la résolution du nom `keycloak` au moment de la requête : nginx
    # démarre même si Keycloak n'est pas encore levé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `404` et non `403` : un refus explicite confirmerait qu'il y a là quelque
    # chose, et la console de Keycloak est une cible connue.
    location / {
        return 404;
    }

    # Autorisation, jetons, formulaires, et `/broker/franceconnect/endpoint` que
    # FranceConnect appelle au retour.
    location ^~ /realms/etape/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    location ^~ /realms/etape/login-actions/ {
        limit_req zone=keycloak_login_actions burst=10 nodelay;
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    location ^~ /realms/etape/protocol/openid-connect/registrations {
        limit_req zone=keycloak_login_actions burst=10 nodelay;
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    location ^~ /realms/etape/protocol/openid-connect/auth {
        limit_req zone=keycloak_authorization burst=20 nodelay;
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }

    # CSS et JS du thème.
    location ^~ /resources/ {
        include /etc/nginx/snippets/keycloak-proxy.inc;
    }
}
