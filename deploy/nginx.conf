# Serveur du déploiement : les deux exports statiques, et l'API sous `/api/`.
#
# Le partage d'origine entre le front et l'API rend inutiles CORS et
# `SameSite=None`, et permet au cookie de session de rester en `Lax`. Keycloak
# vit sur son propre sous-domaine et ne passe pas par ici.

# Le proxy de l'hébergeur termine TLS : le schéma d'origine ne se lit que dans
# l'en-tête. Le repli en `https` évite de propager une valeur vide, qui ferait
# croire à l'API qu'elle est appelée sans chiffrement.
map $http_x_forwarded_proto $etape_schema {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Sinon la redirection `/faq` → `/faq/` porterait le nom et le port internes
    # du conteneur, et expédierait l'internaute sur une adresse injoignable.
    absolute_redirect off;

    # Environnement de recette : rien de tout cela n'a vocation à être indexé.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résolveur DNS de Docker : associé à une variable dans `proxy_pass`, il
    # diffère la résolution du nom `api` au moment de la requête. nginx démarre
    # alors même si l'API n'est pas encore levée.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API d'authentification. Aucune réécriture : l'application porte elle-même
    # le préfixe `/api`, si bien que la `redirect_uri` déclarée dans Keycloak
    # reste valable des deux côtés du proxy.
    location /api/ {
        set $etape_api http://api:3002;
        proxy_pass $etape_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $etape_schema;
        proxy_set_header X-Forwarded-Host  $host;

        # Le parcours porte un `state` à usage unique : une seule réponse mise
        # en cache suffirait à le faire rejouer.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Assets versionnés de Next : leur nom porte une empreinte, leur contenu ne
    # change jamais. Vaut pour les deux apps, d'où le préfixe optionnel.
    location ~ ^(/simulateur)?/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Le simulateur a sa propre 404 : servir celle du site afficherait la
    # navigation de l'autre app.
    location /simulateur/ {
        try_files $uri $uri/ =404;
        error_page 404 /simulateur/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
