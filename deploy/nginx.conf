# Serveur du déploiement : les deux exports statiques, et l'API sous `/api/`.
#
# Le partage d'origine entre le front et l'API n'est pas un détail de confort :
# c'est lui qui rend inutiles CORS et `SameSite=None`, et qui permet au cookie de
# session de rester en `SameSite=Lax`. Keycloak, lui, vit sur son propre
# sous-domaine et ne passe pas par ici — voir `docs/deploiement.md`.

# Le proxy de Coolify termine TLS et transmet en clair sur ce serveur : le
# schéma d'origine ne se lit donc que dans l'en-tête. Le repli en `https` couvre
# le cas où l'en-tête manque, plutôt que de propager une valeur vide qui ferait
# croire à l'API qu'elle est appelée sans chiffrement.
map $http_x_forwarded_proto $etape_schema {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # nginx redirige de lui-même `/faq` vers `/faq/` lorsque le dossier existe.
    # En absolu, cette redirection porterait le nom et le port internes du
    # conteneur : l'internaute serait expédié sur une adresse injoignable.
    absolute_redirect off;

    # Environnement de recette : rien de tout cela n'a vocation à être indexé.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Résolveur DNS de Docker. Associé à l'usage d'une variable dans
    # `proxy_pass`, il diffère la résolution du nom `api` au moment de la
    # requête : nginx démarre alors même si l'API n'est pas encore levée, là où
    # un nom écrit en dur ferait échouer le chargement de la configuration.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # API d'authentification.
    #
    # Aucune réécriture : l'application porte elle-même le préfixe `/api`, si
    # bien que les chemins vus par Nest sont ceux vus par le navigateur. C'est
    # ce qui garantit que la `redirect_uri` déclarée dans Keycloak reste valable
    # des deux côtés du proxy.
    # ---------------------------------------------------------------------
    location /api/ {
        set $etape_api http://api:3002;
        proxy_pass $etape_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $etape_schema;
        proxy_set_header X-Forwarded-Host  $host;

        # Le parcours de connexion n'est qu'une suite de redirections portant un
        # `state` à usage unique : une seule réponse mise en cache suffirait à
        # le faire rejouer.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ---------------------------------------------------------------------
    # Assets versionnés de Next : leur nom contient déjà une empreinte, ils ne
    # changent jamais de contenu. Vaut pour les deux apps, d'où le préfixe
    # optionnel.
    # ---------------------------------------------------------------------
    location ~ ^(/simulateur)?/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Simulateur. Sa page 404 lui est propre : servir celle du site sous
    # `/simulateur/` afficherait la navigation de l'autre app.
    # ---------------------------------------------------------------------
    location /simulateur/ {
        try_files $uri $uri/ =404;
        error_page 404 /simulateur/404.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
