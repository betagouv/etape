<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ETAPE</title>
  </head>
  <body>
    <!--
      Le contenu de `#root` est remplacé par React à son montage. En attendant,
      il porte l'ossature de l'écran — illustration et panneau — qui se peint dès
      la feuille de style analysée.

      Sans lui, la page reste blanche le temps que le bundle démarre : environ
      350 ms mesurés en local, et c'est ce vide qui fait ressembler un passage
      d'onglet à un rechargement. Les classes sont celles du gabarit React, de
      sorte que rien ne bouge quand l'un remplace l'autre.
    -->
    <div id="root">
      <div class="kc-split">
        <div class="kc-illustration"></div>
        <div class="kc-panel"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
