# Messages du thème email — français.
#
# Ce fichier ne redéfinit que ce dont les gabarits d'ETAPE ont besoin ; tout le
# reste vient de `base`. Format `MessageFormat` : les apostrophes se doublent
# (`d''ETAPE`) et `{0}` désigne un paramètre — une apostrophe simple ferait
# disparaître silencieusement le texte qui la suit.

emailVerificationSubject=ETAPE — confirmez votre adresse email
passwordResetSubject=ETAPE — réinitialisation de votre mot de passe

etapeEmailVerificationTitle=Confirmez votre adresse email
etapeEmailVerificationIntro=Un compte ETAPE vient d''être créé avec cette adresse. Confirmez-la pour accéder à votre espace et suivre votre projet de transition professionnelle.
etapeEmailVerificationCta=Confirmer mon adresse

etapeEmailPasswordResetTitle=Réinitialisez votre mot de passe
etapeEmailPasswordResetIntro=Vous avez demandé à changer le mot de passe de votre compte ETAPE.
etapeEmailPasswordResetCta=Choisir un nouveau mot de passe

etapeEmailLinkExpires=Ce lien expire dans {0}.
etapeEmailIgnoreRegistration=Si vous n''êtes pas à l''origine de cette inscription, ignorez ce message : aucun compte ne sera activé.
etapeEmailIgnoreReset=Si vous n''êtes pas à l''origine de cette demande, ignorez ce message : votre mot de passe reste inchangé.
etapeEmailFallback=Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :
etapeEmailFooter=Message automatique — merci de ne pas y répondre.
