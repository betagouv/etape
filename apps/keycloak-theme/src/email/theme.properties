# Thème email d'ETAPE.
#
# `parent=base` fait hériter de tous les gabarits de Keycloak : seuls ceux que
# nous redéfinissons dans `html/` et `text/` sont remplacés. Les emails que nous
# n'avons pas repris (actions requises, alertes de sécurité…) restent donc
# fonctionnels, et prennent malgré tout la mise en page d'ETAPE, portée par
# `html/template.ftl`.
parent=base
locales=fr,en
