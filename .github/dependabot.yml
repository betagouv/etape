version: 2
updates:
  # Dépendances du monorepo, installées par pnpm : l'écosystème `npm` de
  # Dependabot couvre aussi pnpm. La racine suffit : Dependabot y voit les
  # workspaces et met à jour leurs package.json ET le lockfile unique. Lister
  # aussi /apps/* et /packages/* doublait chaque PR, sans le lockfile, donc
  # vouées à échouer à l'installation en CI (#29 à #44).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # pnpm refuse une version publiée depuis moins d'un jour (`minimumReleaseAge`,
    # actif par défaut) : sans ce délai, une PR proposant une version trop
    # récente échouerait à l'installation en CI.
    cooldown:
      default-days: 1
    # Majeures bloquées tant que l'écosystème ne suit pas : retirer la ligne
    # correspondante quand la condition est levée.
    ignore:
      # Aligné sur le runtime (.nvmrc) : suivre la majeure de Node, pas au-delà.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 : Next ne le reconnaît pas encore (typecheck en échec).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 : eslint-plugin-react (tiré par eslint-config-next) casse
      # (`contextOrFilename.getFilename is not a function`).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Code Connect 2 : plus de parseur React, nos *.figma.tsx sont à migrer
      # (`figma connect migrate`) avant de monter.
      - dependency-name: "@figma/code-connect"
        update-types: ["version-update:semver-major"]
    groups:
      # Regroupe les mises à jour mineures/patch dans une seule PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Idem pour les majeures : sans ce groupe, Dependabot ouvre une PR par
      # paquet ET par dossier du monorepo (26 PR d'un coup le 7/09).
      major:
        update-types:
          - major

  # Mises à jour des actions GitHub utilisées par la CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
