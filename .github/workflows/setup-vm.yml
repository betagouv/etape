name: Setup VM

# Configuration du socle d'une VM Cegedim par Ansible (infra/ansible/).
# Déclenchement MANUEL uniquement (aucun évènement git) : onglet Actions →
# Setup VM → « Run workflow », choix de la machine, mot de passe d'exécution.
#
# Le mot de passe est comparé au secret SETUP_VM_PASSWORD. Limite assumée :
# sur un dépôt public, la valeur saisie est visible dans les métadonnées du
# run ; c'est un garde-fou contre les lancements accidentels, pas un secret
# fort (voir infra/ansible/README.md ; contrôle fort = environnement GitHub
# avec approbation obligatoire).

on:
  workflow_dispatch:
    inputs:
      machine:
        description: "Machine à configurer"
        type: choice
        required: true
        options:
          - front
          - back
          - front-recette
          - back-recette
      mot_de_passe:
        description: "Mot de passe d'exécution"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: setup-vm
  cancel-in-progress: false

jobs:
  setup:
    name: Configurer la machine « ${{ inputs.machine }} »
    runs-on: [self-hosted, cegedim]
    steps:
      - name: Vérifier le mot de passe d'exécution
        env:
          SAISIE: ${{ inputs.mot_de_passe }}
          ATTENDU: ${{ secrets.SETUP_VM_PASSWORD }}
        run: |
          if [ -z "$ATTENDU" ]; then
            echo "::error::Le secret SETUP_VM_PASSWORD n'est pas défini dans le dépôt."
            exit 1
          fi
          if [ "$SAISIE" != "$ATTENDU" ]; then
            echo "::error::Mot de passe d'exécution incorrect."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Ansible disponible sur le runner
        # Voie préférée : paquet Debian installé une fois sur OPS01
        # (`sudo apt install -y ansible-core`). À défaut, tentative d'installation
        # dans un venv du compte runner (le runner n'a pas sudo, et pip n'est pas
        # forcément présent) ; sinon, échec explicite.
        run: |
          if command -v ansible-playbook >/dev/null 2>&1; then
            echo "Ansible présent : $(ansible-playbook --version | head -1)"
            exit 0
          fi
          VENV="$HOME/.ansible-venv"
          if [ -x "$VENV/bin/ansible-playbook" ]; then
            echo "$VENV/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          if python3 -m venv "$VENV" && "$VENV/bin/pip" install -q ansible-core; then
            echo "$VENV/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "::error::Ansible absent du runner et installation automatique impossible (pas de venv/pip, ou PyPI injoignable). Sur OPS01, une fois : sudo apt install -y ansible-core"
          exit 1

      - name: Enregistrer les empreintes SSH des machines cibles
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          ssh-keyscan -H \
            debfcoetapfrt01.fco.cegedim.cloud \
            debfcoetapapp01.fco.cegedim.cloud \
            rebfcoetapfrt01.fco.cegedim.cloud \
            rebfcoetapapp01.fco.cegedim.cloud \
            2>/dev/null >> "$HOME/.ssh/known_hosts"

      # Le nom du choix ne suffit plus à désigner le playbook : back-recette
      # réutilise back.yml (même socle) en visant le groupe back_recette. La
      # correspondance choix → (playbook, extra-vars) est écrite une fois ici ;
      # un choix inconnu arrête le job plutôt que de lancer un playbook au hasard.
      - name: Choisir le playbook et sa cible
        id: cible
        env:
          MACHINE: ${{ inputs.machine }}
        run: |
          case "$MACHINE" in
            front)         playbook=front.yml;         extra="" ;;
            back)          playbook=back.yml;          extra="" ;;
            front-recette) playbook=front-recette.yml; extra="" ;;
            back-recette)  playbook=back.yml;          extra="cible=back_recette" ;;
            *)
              echo "::error::Machine inconnue : $MACHINE"
              exit 1
              ;;
          esac
          echo "playbook=$playbook" >> "$GITHUB_OUTPUT"
          echo "extra=$extra" >> "$GITHUB_OUTPUT"

      - name: Appliquer le playbook
        env:
          PLAYBOOK: ${{ steps.cible.outputs.playbook }}
          EXTRA: ${{ steps.cible.outputs.extra }}
          # Lu par front.yml pour écrire le htpasswd de la basic auth des
          # previews (utilisateur « etape »). Obligatoire au premier passage
          # sur le front du dev ; au rejeu, un secret vide laisse le htpasswd en
          # place. Ignoré en Recette (front-recette.yml n'a pas de basic auth).
          PREVIEW_BASIC_AUTH_PASSWORD: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          # Lus par back.yml, dans les deux environnements, pour authentifier la
          # machine au registre Harbor ; mot de passe vide = tâche de login
          # simplement sautée. Les playbooks front ne les lisent pas.
          # Le login n'est pas secret : c'est une variable GitHub (onglet Variables).
          HARBOR_ROBOT_LOGIN: ${{ vars.HARBOR_ROBOT_LOGIN }}
          HARBOR_ROBOT_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        # `-e` n'est ajouté que si le choix en définit une (back-recette) : la
        # ligne lancée pour front, back et front-recette reste celle d'avant.
        run: |
          ansible-playbook \
            -i infra/ansible/inventaire.ini \
            "infra/ansible/$PLAYBOOK" \
            ${EXTRA:+-e "$EXTRA"}
