name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Annule les runs superflus quand on pousse plusieurs fois sur une même PR/branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (format, lint, types, tests, build)
    runs-on: [self-hosted, cegedim]
    env:
      # Pas d'installation des hooks git en CI.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm à la version du champ `packageManager`, installé par le npm du Node
      # qu'on vient de poser. Ni pnpm/action-setup, qui passe par le npm du Node
      # embarqué par le runner, incomplet sur OPS01 ; ni le shim de corepack,
      # qui bloquait six minutes les premières tâches turbo. Pas de cache : le
      # runner est auto-hébergé, le store pnpm reste d'un job à l'autre. Le Node
      # posé par setup-node l'est aussi : `corepack disable` retire un shim qu'un
      # job précédent y aurait laissé, et sur lequel npm refuserait d'écrire.
      - name: Setup pnpm
        run: corepack disable pnpm && npm install -g "$(node -p "require('./package.json').packageManager")" && pnpm --version

      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Cartographie des workspaces
        run: pnpm run check:workspace-map

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm exec turbo run build --filter='!@etape/keycloak-theme'

      - name: Build du thème Keycloak, sans le JAR
        run: pnpm --filter @etape/keycloak-theme run build:bundle
