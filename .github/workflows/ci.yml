name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annule les runs superflus quand on pousse plusieurs fois sur une même PR/branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (format, lint, types, build)
    runs-on: [self-hosted, cegedim]
    env:
      # Pas d'installation des hooks git en CI.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
