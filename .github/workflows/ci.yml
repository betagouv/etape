name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Annule les runs superflus quand on pousse plusieurs fois sur une même PR/branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité (format, lint, types, tests, build)
    runs-on: [self-hosted, cegedim]
    env:
      # Pas d'installation des hooks git en CI.
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm par corepack, à la version du champ `packageManager`. Pas de
      # pnpm/action-setup : il s'installe avec le npm du Node embarqué par le
      # runner, incomplet sur OPS01. Pas de cache non plus : le runner est
      # auto-hébergé, le store pnpm reste d'un job à l'autre.
      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: corepack enable pnpm && pnpm --version

      - name: Install (lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Cartographie des workspaces
        run: pnpm run check:workspace-map

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      - name: Build
        run: pnpm exec turbo run build --filter='!@etape/keycloak-theme'

      - name: Build du thème Keycloak, sans le JAR
        run: pnpm --filter @etape/keycloak-theme run build:bundle
