# Keycloak de développement local, avec sa base.
#
# Sert uniquement à faire tourner le parcours de connexion sur un poste. La
# configuration de production dépendra de l'hébergement retenu et n'est pas
# décrite ici.
#
#   docker compose up -d
#
# Console d'administration : http://localhost:8080 (admin / admin)
#
# Aucun serveur SMTP : le realm de développement n'envoie donc pas d'email, et
# `verifyEmail` y est désactivé pour que l'inscription aboutisse quand même. Les
# gabarits d'email existent (`apps/keycloak-theme/src/email`) mais ne sont pas
# jouables ici — voir `docs/authentification.md`.

services:
  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    # `start-dev` désactive HTTPS et le cache distribué. Interdit en production,
    # où l'on utilise `start` avec un certificat et un hostname explicites.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Tout fichier de realm déposé ici est importé au démarrage. Permet de
      # versionner la configuration plutôt que de la recréer à la main sur
      # chaque poste — voir `docs/authentification.md`.
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      # Extensions : le thème ETAPE et le broker FranceConnect, rassemblés par
      # `keycloak-providers` ci-dessous.
      - keycloak-providers:/opt/keycloak/providers:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
      keycloak-providers:
        condition: service_completed_successfully

  # Rassemble les extensions que Keycloak charge au démarrage.
  #
  # Keycloak ne lit qu'un seul dossier, `providers`. Il en faut pourtant deux
  # choses d'origines différentes — le thème, construit ici, et le broker
  # FranceConnect, téléchargé — d'où ce volume et le conteneur qui le remplit
  # plutôt qu'un montage direct du dossier de build.
  #
  # L'extension n'est pas un supplément d'agrément : le realm déclare son
  # identity provider sous `franceconnect-particulier`, et Keycloak **refuse de
  # démarrer** s'il ne connaît pas cet identifiant. Sans elle, `docker compose
  # up` échoue sur « Invalid identity provider id » et rien ne tourne, pas même
  # la connexion par mot de passe. La version suit celle du `Dockerfile`.
  keycloak-providers:
    image: alpine:3.22
    restart: "no"
    environment:
      # Version et empreinte vont par paire, comme dans le `Dockerfile` :
      # changer l'une sans l'autre fait échouer le téléchargement. C'est ce qui
      # sépare une extension chargée dans Keycloak avec les droits du serveur
      # d'un binaire quelconque servi par une réponse détournée.
      KEYCLOAK_FRANCECONNECT_VERSION: ${KEYCLOAK_FRANCECONNECT_VERSION:-7.7.0}
      KEYCLOAK_FRANCECONNECT_SHA256: ${KEYCLOAK_FRANCECONNECT_SHA256:-e6a3853ac6fcf5e55e32cead622612ad03a1df034f4ba6be808f6aa7cf2d8fd7}
    volumes:
      - keycloak-providers:/providers
      # Sortie du build du thème. Absente sur un dépôt fraîchement cloné, où
      # rien n'a encore été construit : Keycloak démarre alors avec son thème
      # par défaut, ce qui vaut mieux qu'un échec.
      - ./apps/keycloak-theme/dist_keycloak:/theme:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        jar=/providers/keycloak-franceconnect-$$KEYCLOAK_FRANCECONNECT_VERSION.jar
        if [ ! -f "$$jar" ]; then
          apk add --no-cache curl >/dev/null
          # Les versions antérieures sont retirées : deux JAR de la même
          # extension dans `providers` empêchent Keycloak de démarrer.
          rm -f /providers/keycloak-franceconnect-*.jar
          curl -fsSL -o "$$jar" \
            "https://github.com/InseeFr/Keycloak-FranceConnect/releases/download/$$KEYCLOAK_FRANCECONNECT_VERSION/keycloak-franceconnect-$$KEYCLOAK_FRANCECONNECT_VERSION.jar"
          # Le JAR est retiré si l'empreinte ne correspond pas : le laisser en
          # place le ferait charger au démarrage suivant sans plus rien vérifier.
          echo "$$KEYCLOAK_FRANCECONNECT_SHA256  $$jar" | sha256sum -c - || { rm -f "$$jar"; exit 1; }
          echo "extension FranceConnect $$KEYCLOAK_FRANCECONNECT_VERSION téléchargée et vérifiée."
        fi

        # Recopié à chaque démarrage : c'est ce qui fait prendre une
        # reconstruction du thème sans avoir à vider le volume.
        rm -f /providers/etape-keycloak-theme.jar
        if [ -f /theme/etape-keycloak-theme.jar ]; then
          cp /theme/etape-keycloak-theme.jar /providers/
          echo "thème ETAPE installé."
        else
          echo "thème ETAPE non construit — Keycloak servira son thème par défaut."
          echo "  npm run build -- --filter=@etape/keycloak-theme pour l'obtenir."
        fi

  # Applique après import ce qu'un fichier de realm ne peut pas porter.
  #
  # Deux raisons distinctes de passer par `kcadm` :
  #
  # 1. Le realm `master` est créé par Keycloak lui-même, hors de tout fichier
  #    d'import. Il naît en `sslRequired: external` — « HTTPS obligatoire sauf
  #    depuis une adresse locale ». Or avec le mapping de ports de Docker Desktop,
  #    une requête venue de l'hôte se présente sous l'adresse de la passerelle et
  #    non en loopback : Keycloak la juge externe et répond « HTTPS required ». La
  #    console d'administration s'affiche puis échoue à se connecter, panne
  #    déroutante s'il faut la diagnostiquer soi-même. Ce conteneur passe par le
  #    réseau Docker, où l'adresse privée est bien reconnue comme locale.
  #
  # 2. L'import de realm ne substitue **aucune** variable : ni environnement, ni
  #    propriété système. Une valeur `${env.X:defaut}` retombe toujours sur son
  #    défaut (vérifié sur Keycloak 26.7). Les secrets FranceConnect ne peuvent
  #    donc pas être injectés dans le JSON — ils sont posés ici, après coup.
  #
  # Strictement réservé au développement.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.7
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      FRANCECONNECT_CLIENT_ID: ${FRANCECONNECT_CLIENT_ID:-}
      FRANCECONNECT_CLIENT_SECRET: ${FRANCECONNECT_CLIENT_SECRET:-}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        KCADM=/opt/keycloak/bin/kcadm.sh
        until $$KCADM config credentials --server http://keycloak:8080 \
          --realm master --user admin --password admin >/dev/null 2>&1; do sleep 3; done

        $$KCADM update realms/master -s sslRequired=NONE
        echo "master : sslRequired=NONE — console admin joignable en HTTP depuis l'hôte."

        if [ -n "$$FRANCECONNECT_CLIENT_ID" ]; then
          $$KCADM update identity-provider/instances/franceconnect -r etape \
            -s "config.clientId=$$FRANCECONNECT_CLIENT_ID" \
            -s "config.clientSecret=$$FRANCECONNECT_CLIENT_SECRET"
          echo "franceconnect : identifiants injectés."
        else
          echo "franceconnect : aucun identifiant fourni — le fournisseur restera inutilisable."
          echo "                renseigner FRANCECONNECT_CLIENT_ID / _SECRET puis relancer."
        fi

volumes:
  keycloak-db-data:
  keycloak-providers:
