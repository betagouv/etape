# Previews par PR — nginx sur DEBFCOETAPFRT01
#
# Une preview = un dossier /srv/previews/pr-<n>/, déposé par rsync depuis le
# runner GitHub (DEBFCOETAPOPS01) via .github/workflows/preview.yml.
#
# Le vhost est résolu par une regex sur le hostname : il n'y a AUCUNE conf à
# créer, modifier ou recharger par PR. Créer le dossier crée l'environnement,
# le supprimer le détruit — c'est ce qui rend le cycle « à la Vercel » trivial
# sur une simple VM.
#
# Ces règles reproduisent l'ex-`config.json` Vercel (scripts/vercel-out.mjs) :
# noindex partout, 308 sur le préfixe du simulateur, 404 servie par la bonne app.
#
# Installation (une fois, en root sur FRT01) :
#   1. useradd -m -s /bin/bash deploy
#      mkdir -p /srv/previews && chown deploy:deploy /srv/previews
#   2. install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
#      → clé publique du runner (générée sur OPS01) dans
#        /home/deploy/.ssh/authorized_keys
#   3. Copier ce fichier dans /etc/nginx/sites-available/previews.conf,
#      ln -s vers sites-enabled/, puis `nginx -t && systemctl reload nginx`.
#   4. Déposer le certificat wildcard *.dev.certifpro.cegedim.cloud fourni par
#      Cegedim aux chemins ci-dessous (à adapter le cas échéant).
#
# NB : si le préfixe du simulateur change un jour dans paths.mjs, les
# occurrences de « /simulateur » ci-dessous sont à aligner.

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name ~^pr-\d+\.dev\.certifpro\.cegedim\.cloud$;
  return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Une preview par hostname : pr-<n>.dev.certifpro.cegedim.cloud
# ---------------------------------------------------------------------------
server {
  listen 443 ssl;
  server_name ~^pr-(?<pr>\d+)\.dev\.certifpro\.cegedim\.cloud$;

  # Certificat wildcard fourni par Cegedim — chemins à adapter.
  ssl_certificate /etc/nginx/ssl/wildcard.dev.certifpro.cegedim.cloud.fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/wildcard.dev.certifpro.cegedim.cloud.key.pem;

  root /srv/previews/pr-$pr;
  index index.html;

  # Jamais indexées — en plus du robots.txt (Disallow: /) embarqué par les apps.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # Basic auth — décision du 25/08 : exposition publique + basic auth.
  # À activer en décommentant les SIX directives ci-dessous, une fois le
  # fichier de mots de passe créé :
  #   apt install -y apache2-utils && htpasswd -c -B /etc/nginx/previews.htpasswd etape
  # `satisfy any` + allow localhost : le smoke test du workflow (curl exécuté
  # sur la VM elle-même) passe sans identifiants ; tout accès distant les exige.
  # Ne jamais décommenter allow/deny sans auth_basic : cela fermerait tout.
  # satisfy any;
  # allow 127.0.0.1;
  # allow ::1;
  # deny all;
  # auth_basic "Preview ETAPE";
  # auth_basic_user_file /etc/nginx/previews.htpasswd;

  # 404 rendue par l'app « site » par défaut (règle Vercel `handle: error`)…
  error_page 404 /404.html;

  # `trailingSlash: true` côté Next : un export statique ne peut pas rediriger
  # de lui-même, la 308 du préfixe se fait donc ici (identique à l'ex-config
  # Vercel ; pour les autres répertoires, nginx ajoute déjà le slash en 301).
  location = /simulateur {
    return 308 /simulateur/;
  }

  # …et par l'app « simulateur » sous son préfixe.
  location /simulateur/ {
    error_page 404 /simulateur/404.html;
  }

  # Assets Next fingerprintés : cache long. (add_header redéfini dans un bloc
  # ne s'hérite pas — on répète le noindex.)
  location ~ ^(/simulateur)?/_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
}

# ---------------------------------------------------------------------------
# Tout autre hostname atteignant cette IP : rien à servir.
# ---------------------------------------------------------------------------
server {
  listen 80 default_server;
  listen 443 ssl default_server;
  server_name _;

  ssl_certificate /etc/nginx/ssl/wildcard.dev.certifpro.cegedim.cloud.fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/wildcard.dev.certifpro.cegedim.cloud.key.pem;

  return 404;
}
